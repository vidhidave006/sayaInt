name: Deploy to Windows VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Runs on a self-hosted GitHub Actions runner installed on the Windows VPS.
# Builds the static export and mirrors ./out into the IIS site folder.
jobs:
  deploy:
    runs-on: [self-hosted, windows]
    concurrency:
      group: deploy-vps
      cancel-in-progress: true
    env:
      IIS_SITE_PATH: C:\inetpub\sites\mokshtechno
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Mirror out/ into IIS site folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:IIS_SITE_PATH | Out-Null
          robocopy .\out $env:IIS_SITE_PATH /MIR /R:2 /W:2 /NFL /NDL /NJH /NJS /NP
          # robocopy exit codes < 8 mean success
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE } else { exit 0 }
